name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/865213359973/locations/global/workloadIdentityPools/castai-github-wif-pool/providers/castai-cluster-proportional-vert'
          service_account: 'image-writer-library@cicd-master-oxk5.iam.gserviceaccount.com'
          audience: 'https://cloud.google.com'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to Artifact Registry
        env:
          REGISTRY: us-docker.pkg.dev/castai-hub/library/cpa
          VERSION: ${{ github.ref_name }}
        run: make manifest-list

      - name: Build and push to GHCR
        env:
          REGISTRY: ghcr.io/castai/images/cpa
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: make manifest-list

      - name: Install crane
        run: |
          CRANE_VERSION=v0.20.3
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Sign the images (keyless)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in \
            "us-docker.pkg.dev/castai-hub/library/cpa/cpvpa" \
            "ghcr.io/castai/images/cpa/cpvpa"; do
            digest="$(crane digest "${image}:${VERSION}")"
            cosign sign --yes "${image}@${digest}"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/castai/cluster-proportional-vertical-autoscaler/' \
              "${image}@${digest}" >/dev/null
            echo "signed and verified ${image}@${digest}"
          done
